# Refreshes data/site.json (FRED numbers, Google News headlines, The Capital Order videos) every 6 hours,
# so usmoneywatch.blogspot.com stays current without any computer running.
name: Update site data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name 'US Money Watch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/site.json
          git diff --cached --quiet && exit 0
          git commit -m "Update site data"
          git pull --rebase origin main
          git push
